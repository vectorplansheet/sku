/* =====================================================================
   ГЕОМЕТРИЯ (та же логика, что buildGeo / positionAt в panel.html)
   ===================================================================== */
const R_EARTH = 6371000;
const rad = x => x * Math.PI / 180;
const deg = x => x * 180 / Math.PI;

function distM(a, b) {
  const dLa = rad(b.lat - a.lat), dLo = rad(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R_EARTH * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}
function bearingDeg(a, b) {
  const la1 = rad(a.lat), la2 = rad(b.lat), dLo = rad(b.lng - a.lng);
  const y = Math.sin(dLo) * Math.cos(la2);
  const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLo);
  return (deg(Math.atan2(y, x)) + 360) % 360;
}

// route: [[lat,lng,speedKmh?,altM?], ...]; скорость/высота точки действуют на отрезок К ней и дальше
function buildGeo(spawn, route, baseSpeedKmh, baseAltM) {
  const pts = [spawn, ...(Array.isArray(route) ? route : [])];
  const segs = [];
  let totalDist = 0, totalTimeS = 0;
  let prevSpeed = Number(baseSpeedKmh) || 0;
  let prevAlt = Number(baseAltM) || 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = { lat: pts[i][0], lng: pts[i][1] };
    const b = { lat: pts[i + 1][0], lng: pts[i + 1][1] };
    const d = distM(a, b);
    const rp = route && route[i];
    const es = Array.isArray(rp) ? Number(rp[2]) : NaN;
    const ea = Array.isArray(rp) ? Number(rp[3]) : NaN;
    const speedKmh = (isFinite(es) && es > 0) ? es : prevSpeed;  prevSpeed = speedKmh;
    const altM     = (isFinite(ea) && ea > 0) ? ea : prevAlt;    prevAlt = altM;
    const mps = speedKmh / 3.6;
    const durS = mps > 0 ? d / mps : 0;
    segs.push({ a, b, d, from: totalDist, fromT: totalTimeS, durS, brng: bearingDeg(a, b), speedKmh, altM });
    totalDist += d; totalTimeS += durS;
  }
  // скругление поворотов: на каждом изломе маршрута срезаем угол дугой (квадратичная кривая Безье)
  const corners = [];
  for (let i = 1; i < segs.length; i++) {
    const sp = segs[i - 1], sn = segs[i];
    let dd = Math.abs(((sn.brng - sp.brng + 540) % 360) - 180);
    if (!(sp.d > 0 && sn.d > 0) || dd < 2) continue;
    const R = Math.max(400, Math.min(4000, sp.speedKmh / 3.6 * 12));      // радиус разворота ~ от скорости
    const c = Math.min(R * Math.tan(rad(dd) / 2), 0.45 * Math.min(sp.d, sn.d));
    const kp = 1 - c / sp.d, kn = c / sn.d, v = sp.b;
    corners[i] = { c,
      P0: { lat: sp.a.lat + (sp.b.lat - sp.a.lat) * kp, lng: sp.a.lng + (sp.b.lng - sp.a.lng) * kp },
      P1: { lat: v.lat, lng: v.lng },
      P2: { lat: sn.a.lat + (sn.b.lat - sn.a.lat) * kn, lng: sn.a.lng + (sn.b.lng - sn.a.lng) * kn } };
  }
  return { pts, segs, totalDist, totalTimeS, corners };
}

// точка и курс на дуге скругления, s = 0..1
function cornerAt(cn, s) {
  const q = 1 - s, { P0, P1, P2 } = cn;
  const lat = q * q * P0.lat + 2 * q * s * P1.lat + s * s * P2.lat;
  const lng = q * q * P0.lng + 2 * q * s * P1.lng + s * s * P2.lng;
  const dLat = 2 * q * (P1.lat - P0.lat) + 2 * s * (P2.lat - P1.lat);
  const dLng = 2 * q * (P1.lng - P0.lng) + 2 * s * (P2.lng - P1.lng);
  return { lat, lng, heading: (deg(Math.atan2(dLng * Math.cos(rad(lat)), dLat)) + 360) % 360 };
}

function positionAt(geo, t) {
  const last = geo.pts[geo.pts.length - 1];
  if (!geo.segs.length) return { lat: geo.pts[0][0], lng: geo.pts[0][1], heading: 0, speedKmh: 0, altM: 0, seg: 0, done: true };
  const s0 = geo.segs[0], sN = geo.segs[geo.segs.length - 1];
  if (t <= 0) return { lat: geo.pts[0][0], lng: geo.pts[0][1], heading: s0.brng, speedKmh: s0.speedKmh, altM: s0.altM, seg: 0, done: false };
  if (t >= geo.totalTimeS) return { lat: last[0], lng: last[1], heading: sN.brng, speedKmh: sN.speedKmh, altM: sN.altM, seg: geo.segs.length - 1, done: true };
  for (let i = 0; i < geo.segs.length; i++) {
    const s = geo.segs[i];
    if (t <= s.fromT + s.durS) {
      const k = s.durS > 0 ? (t - s.fromT) / s.durS : 0;
      const res = { lat: s.a.lat + (s.b.lat - s.a.lat) * k, lng: s.a.lng + (s.b.lng - s.a.lng) * k,
                    heading: s.brng, speedKmh: s.speedKmh, altM: s.altM, seg: i, done: false };
      const cs = geo.corners || [], u = k * s.d;
      const cin = cs[i], cout = cs[i + 1];
      let cn = null, sp = 0, ci = 0;
      if (cin && u < cin.c) { cn = cin; sp = 0.5 + 0.5 * u / cin.c; ci = i; }                           // выход из поворота
      else if (cout && s.d - u < cout.c) { cn = cout; sp = 0.5 * (1 - (s.d - u) / cout.c); ci = i + 1; } // вход в поворот
      if (cn) { const q = cornerAt(cn, sp); res.lat = q.lat; res.lng = q.lng; res.heading = q.heading; res.cornerI = ci; res.cornerS = sp; }
      return res;
    }
  }
  return { lat: last[0], lng: last[1], heading: sN.brng, speedKmh: sN.speedKmh, altM: sN.altM, seg: geo.segs.length - 1, done: true };
}

// время полёта до wpIndex-го вайпоинта (для триггеров) — как timeToWpMs в старом index.html
function timeToWpMs(spawn, route, baseSpeed, wpIndex) {
  const g = buildGeo(spawn, route, baseSpeed, 0);
  let t = 0;
  for (let i = 0; i < Math.min(wpIndex, g.segs.length); i++) t += g.segs[i].durS;
  return t * 1000;
}

/* =====================================================================
   ID / ВЫСОТА (логика старого index.html: уникальные, без «666»,
   диапазоны по типу цели, смещение высоты к низу диапазона)
   ===================================================================== */
const usedIds = new Set();
const seq = { shahedA: 9700, shahedB: 9800, plane: 9600, reserve: 8000 };
let fastCounter = 9900;

const idOk = id => id != null && !String(id).includes('666') && !usedIds.has(id);
function randFree(start, end) {
  for (let i = 0; i < 300; i++) {
    const id = start + Math.floor(Math.random() * (end - start + 1));
    if (idOk(id)) { usedIds.add(id); return id; }
  }
  for (let i = start; i <= end; i++) if (idOk(i)) { usedIds.add(i); return i; }
  return null;
}
function seqFree(key, start, end) {
  for (let i = 0; i <= end - start; i++) {
    if (seq[key] > end) seq[key] = start;
    const id = seq[key]++;
    if (idOk(id)) { usedIds.add(id); return id; }
  }
  return null;
}
function pickId(key, start, end) {
  const randomMode = Math.random() < 0.3;
  let id = randomMode ? (randFree(start, end) ?? seqFree(key, start, end))
                      : (seqFree(key, start, end) ?? randFree(start, end));
  if (id == null) id = seqFree('reserve', 8000, 9500) ?? randFree(8000, 9500);
  return id ?? 8000;
}
function generateId(type, speed, label) {
  if (speed > 3000) {                                   // быстрые (баллистика / гиперзвук)
    for (let i = 0; i <= 100; i++) {
      if (fastCounter > 9950) fastCounter = 9900;
      const id = fastCounter++;
      if (idOk(id)) { usedIds.add(id); return id; }
    }
  }
  const t = type || '';
  if (/Гербера|Герань-2/.test(t) || label === 'дрон-имит.' || label === 'уд.дрон') return Math.random() < 0.5 ? pickId('shahedA', 9700, 9799) : pickId('shahedB', 9800, 9899);
  if (/Су-|КАБ/.test(t) || /^(Су-|МиГ-|Ф-16|Ту-|КАБ)/.test(label || '')) return pickId('plane', 9600, 9699);
  return seqFree('reserve', 8000, 9500) ?? randFree(8000, 9500) ?? 8000;   // «8004» и т.п.
}

// скорость → тип; если ни один диапазон не подошёл — берём тип по названию из панели
function classifyTarget(type, speed) {
  if (/Бандероль/.test(type || '')) return 'бандероль';   // подпись по названию, а не по скорости
  const sp = Number(speed) || 0;
  const h = SPEED_CLASSES.find(([lo, hi]) => sp >= lo && sp <= hi);
  if (h) return typeof h[2] === 'function' ? h[2]() : h[2];
  return typeLabel(type);
}

/* ---------- точные границы Украины и областей ----------
   Области грузятся из открытого GeoJSON. Государственная граница считается из них же: рёбра, которые принадлежат только одной области,
   — это внешний контур (суша + побережье), поэтому граница ровно совпадает с границами областей. Запасные варианты: UKR.geo.json → грубый контур. */
(function () {
  const first = async urls => { for (const u of urls) { try { const r = await fetch(u); if (r.ok) return await r.json(); } catch (e) {} } return null; };

  function outerBorder(fc) {
    const key = p => p[0].toFixed(5) + ',' + p[1].toFixed(5);
    const edges = new Map();            // "a|b" → { a, b, n }
    const addRing = ring => {
      for (let i = 0; i < ring.length - 1; i++) {
        const ka = key(ring[i]), kb = key(ring[i + 1]);
        if (ka === kb) continue;
        const k = ka < kb ? ka + '|' + kb : kb + '|' + ka;
        const e = edges.get(k);
        if (e) e.n++; else edges.set(k, { a: ring[i], b: ring[i + 1], ka, kb, n: 1 });
      }
    };
    for (const f of fc.features || []) {
      const g = f.geometry; if (!g) continue;
      if (g.type === 'Polygon') g.coordinates.forEach(addRing);
      else if (g.type === 'MultiPolygon') g.coordinates.forEach(poly => poly.forEach(addRing));
    }
    const outer = [...edges.values()].filter(e => e.n === 1);
    if (!outer.length || outer.length > edges.size * 0.8) return null;      // вершины областей не совпадают — метод не подходит

    const adj = new Map();                                                 // узел → рёбра
    outer.forEach((e, i) => { e.i = i; (adj.get(e.ka) || adj.set(e.ka, []).get(e.ka)).push(e); (adj.get(e.kb) || adj.set(e.kb, []).get(e.kb)).push(e); });
    const used = new Set(), lines = [];
    for (const e0 of outer) {
      if (used.has(e0.i)) continue;
      used.add(e0.i);
      const pts = [e0.a, e0.b]; let end = e0.kb;
      for (;;) {                                                           // идём вперёд по цепочке
        const nx = (adj.get(end) || []).find(e => !used.has(e.i));
        if (!nx) break;
        used.add(nx.i);
        if (nx.ka === end) { pts.push(nx.b); end = nx.kb; } else { pts.push(nx.a); end = nx.ka; }
      }
      lines.push(pts);
    }
    // выкидываем маленькие замкнутые контуры внутри страны (например Киев как анклав)
    const keep = lines.filter(pts => {
      let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      for (const p of pts) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
      const closed = key(pts[0]) === key(pts[pts.length - 1]);
      return !(closed && Math.max(x1 - x0, y1 - y0) < 1.0);
    });
    if (!keep.length) return null;
    return { type: 'Feature', properties: {}, geometry: { type: 'MultiLineString', coordinates: keep } };
  }

  // кэш в IndexedDB: при повторных заходах точная граница и области появляются сразу, без сети
  const DB_NAME = 'skymap-ua', STORE = 'geo', CK = 'ua-v1';
  const idb = () => new Promise((res, rej) => { try { const r = indexedDB.open(DB_NAME, 1); r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
  const cacheGet = async () => { try { const d = await idb(); return await new Promise(res => { const q = d.transaction(STORE).objectStore(STORE).get(CK); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } };
  const cachePut = async v => { try { const d = await idb(); d.transaction(STORE, 'readwrite').objectStore(STORE).put(v, CK); } catch (e) {} };

  const show = (obl, border) => {
    if (obl) map.getSource('uaOblasts').setData(obl);
    if (border) map.getSource('uaBorder').setData(border);
  };

  const apply = async () => {
    const cached = await cacheGet();
    if (cached && cached.obl && cached.border) { show(cached.obl, cached.border); return; }   // уже скачано раньше — показываем сразу

    const obl = await first(['https://cdn.jsdelivr.net/gh/EugeneBorshch/ukraine_geojson@master/UA_FULL_Ukraine.geojson',
                             'https://raw.githubusercontent.com/EugeneBorshch/ukraine_geojson/master/UA_FULL_Ukraine.geojson']);
    let border = null;
    if (obl && obl.features) { try { border = outerBorder(obl); } catch (e) { console.error('[border]', e); } }
    if (!border) {
      const cty = await first(['https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries/UKR.geo.json',
                               'https://raw.githubusercontent.com/johan/world.geo.json/master/countries/UKR.geo.json']);
      if (cty) border = cty.type === 'FeatureCollection' ? cty.features[0] : cty;
    }
    if (obl && border) { show(obl, border); cachePut({ obl, border }); return; }
    show(obl, border || UA_BORDER_ROUGH);      // сеть не помогла — хотя бы грубый контур (в кэш не кладём)
  };
  if (map.loaded && map.loaded()) apply(); else map.once('load', apply);
})();
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');   // только +/−, без компаса
map.touchZoomRotate.disableRotation();   // без поворота двумя пальцами
map.keyboard.disableRotation();          // и с клавиатуры
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

let mapReady = false;
const setData = (id, features) => { const s = map.getSource(id); if (s) s.setData({ type: 'FeatureCollection', features }); };

/* ---------- иконка стрелки: слева белая, справа красная, чёрная обводка ---------- */
function makeArrowImage(col = '#ff7f7f') {
  const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const path = () => { g.beginPath(); g.moveTo(32, 13); g.lineTo(51, 52); g.lineTo(32, 42); g.lineTo(13, 52); g.closePath(); };
  g.lineJoin = 'round'; g.lineCap = 'round';
  path(); g.lineWidth = 16; g.strokeStyle = '#000'; g.stroke();      // чёрная обводка
  path(); g.lineWidth = 9; g.strokeStyle = col; g.stroke();    // скругление
  g.fillStyle = col; g.fill();                                 // красный цвет цели
  return g.getImageData(0, 0, S, S);
}

// силуэт Су-34 (вид сверху, нос вверх) — то же оформление, что у стрелки: чёрная обводка + цвет цели
function makeSu34Image(col = '#ff7f7f') {
  const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const R = [[32,3],[35,7],[37,13],[37.5,22],[38,23],[46,21],[47,24],[38.5,27],[39,31],[58,41],[58,45],[40,50],[39.5,53],[46,57],[46,60],[40,59.5],[39,62],[34.5,62],[33.5,58],[32,63]];
  const pts = R.concat(R.slice(0, -1).reverse().map(([x, y]) => [64 - x, y]));
  const k = 0.7;
  const path = () => {
    g.beginPath();
    pts.forEach(([x, y], i) => { const X = 32 + (x - 32) * k, Y = 32 + (y - 32) * k; i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
    g.closePath();
  };
  g.lineJoin = 'round'; g.lineCap = 'round';
  path(); g.lineWidth = 9 * k; g.strokeStyle = '#000'; g.stroke();   // чёрная обводка
  path(); g.lineWidth = 3 * k; g.strokeStyle = col; g.stroke();      // скругление
  g.fillStyle = col; g.fill();
  return g.getImageData(0, 0, S, S);
}

/* ---------- формуляр: очень тёмно-красная плашка + красное свечение ---------- */
function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function makeLabelImage(lines, pal) {
  pal = pal || { id: '#ffc4c4', tx: '#ffa9a9', fill: 'rgba(34, 3, 3, .97)', border: 'rgba(170, 30, 30, .9)', glow: 'rgba(255, 35, 35, .6)', sh: 'rgba(255, 80, 80, .55)' };
  const dpr = 2, M = 14, padX = 7, padY = 4, lh = 14.5, fs = 11.5;
  const font = `600 ${fs}px Manrope, Arial, sans-serif`;
  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  const w = Math.ceil(Math.max(...lines.map(t => m.measureText(t).width))) + padX * 2;
  const h = lines.length * lh + padY * 2 - 3;
  const c = document.createElement('canvas');
  c.width = (w + M * 2) * dpr; c.height = (h + M * 2) * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  // свечение (два прохода — ярче)
  g.shadowColor = pal.glow; g.shadowBlur = 6; g.fillStyle = pal.fill;
  rrect(g, M, M, w, h, 3); g.fill();
  g.shadowBlur = 0; g.shadowColor = 'transparent';
  rrect(g, M, M, w, h, 3); g.fill();
  g.lineWidth = 1; g.strokeStyle = pal.border; g.stroke();
  // текст
  g.textBaseline = 'middle';
  lines.forEach((t, i) => {
    const y = M + padY + lh * i + lh / 2 - 2;
    let x = M + padX;
    if (i === 0) {
      const sp = t.indexOf(' ');
      const idPart = sp > 0 ? t.slice(0, sp) : t, rest = sp > 0 ? t.slice(sp) : '';
      // ID — белый, жирный
      g.font = `800 ${fs}px Manrope, Arial, sans-serif`; g.fillStyle = pal.id;
            g.shadowColor = pal.sh; g.shadowBlur = 3;
      g.fillText(idPart, x, y);
      x += g.measureText(idPart).width;
      t = rest;
    }
    // остальное — краснее
    g.font = font; g.fillStyle = pal.tx;
    g.shadowColor = pal.sh; g.shadowBlur = 3;
    if (t) g.fillText(t, x, y);
  });
  return { data: g.getImageData(0, 0, c.width, c.height), dpr };
}

/* =====================================================================
   ЦЕЛИ
   ===================================================================== */
const states = new Map();          // key -> state
const liveCache = {};              // live/<key>
const editCache = {};              // targetEdits/<key>
const pendingImgRemove = [];     // имена картинок, которые можно удалить (удаляем с задержкой — см. flushImages)
let dirtyT = true;               // нужно ли перезаливать источники targets/trails в карту
let dirtySel = true;
const IMG_TTL = 6000;
// Картинку удаляем не сразу: воркер карты ещё может раскладывать тайлы по старым данным,
// и если картинки уже нет — все формуляры/стрелки пропадают до следующего обновления.
function flushImages(list) {
  const now = performance.now();
  for (let i = 0; i < list.length;) {
    let it = list[i];
    if (typeof it === 'string') { list[i] = it = { n: it, t: now }; }
    if (now - it.t > IMG_TTL) { if (map.hasImage(it.n)) map.removeImage(it.n); list.splice(i, 1); } else i++;
  }
}
// если стиль/воркер запросил картинку, которой нет — не ломаем слой, отдаём пустую
map.on('styleimagemissing', e => {
  if (!e.id || map.hasImage(e.id)) return;
  map.addImage(e.id, { width: 1, height: 1, data: new Uint8Array(4) });
});
let imgCounter = 0;
let selectedKey = null;
let callsign = (localStorage.getItem('callsign') || 'virazh').trim() || 'virazh';

function currentAlt(st, now) {
  const p = positionAt(st.geo, (now - st.launchAtMs) / 1000);
  return st.kab ? kabAlt(st, p) : p.altM;
}
// КАБ: высота падает от стартовой до 50 м пропорционально пройденному пути
function kabAlt(st, p) {
  const seg = st.geo.segs[p.seg];
  const done = seg ? seg.from + distM(seg.a, { lat: p.lat, lng: p.lng }) : st.geo.totalDist;
  const f = st.geo.totalDist > 0 ? Math.min(1, done / st.geo.totalDist) : 1;
  return Math.max(50, st.kabStart + (50 - st.kabStart) * f);
}

function spawnTarget(o) {
  if (!mapReady) { setTimeout(() => spawnTarget(o), 200); return; }   // карта ещё грузится
  if (states.has(o.key)) return;
  const speed = Number(o.speed) || 0;
  const route = Array.isArray(o.route) ? o.route : [];
  const label = classifyTarget(o.type, speed);   // тип — по скорости
  const baseAlt = o.kabStart || 0;   // высота — только из маршрута панели (4-й элемент точки)
  const st = {
    key: o.key, type: o.type || '', label,
    id: generateId(o.type, speed, label),
    geo: buildGeo(o.spawn, route, speed, baseAlt),
    launchAtMs: o.launchAtMs, editTs: 0,
    kab: !!o.kabStart, kabStart: o.kabStart || 0,
    lblName: null, lblKey: '', removeTimer: null,
    feature: { type: 'Feature', properties: { key: o.key, heading: 0, lbl: '' }, geometry: { type: 'Point', coordinates: [o.spawn[1], o.spawn[0]] } },
    trail: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [[o.spawn[1], o.spawn[0]], [o.spawn[1], o.spawn[0]]] } }
  };
  states.set(o.key, st);
  refreshState(st, srvNow(), true);

  // правки/live, пришедшие раньше, чем цель появилась
  if (editCache[o.key]) applyEdit(st, editCache[o.key]);
  if (liveCache[o.key]) applyLive(st, liveCache[o.key]);
}

function removeTarget(key) {
  const st = states.get(key);
  if (!st) return;
  clearTimeout(st.removeTimer);
  states.delete(key); dirtyT = true;
  if (st.lblName) pendingImgRemove.push(st.lblName);
  if (selectedKey === key) select(null);
}

function setLabel(st, p, alt) {
  const sp = Math.round(p.speedKmh || 0), al = Math.round(alt || 0);
  const k = sp + '|' + al + '|' + callsign;
  if (k === st.lblKey) return;
  st.lblKey = k;
  const lines = al > 0
    ? [`${st.id} ${callsign}`, `${uaLabel(st.label)} ${al}м`, `${sp}км/г`]
    : [`${st.id} ${callsign}`, `${uaLabel(st.label)} ${sp}км/г`];       // высоты нет — две строки
  const img = makeLabelImage(lines);
  const name = 'lbl-' + (++imgCounter);
  map.addImage(name, img.data, { pixelRatio: img.dpr });
  if (st.lblName) pendingImgRemove.push(st.lblName);
  st.lblName = name;
  st.feature.properties.lbl = name;
}

function refreshState(st, now, force) {
  const t = (now - st.launchAtMs) / 1000;
  const p = positionAt(st.geo, t);
  const alt = st.kab ? kabAlt(st, p) : p.altM;
  const c = st.feature.geometry.coordinates;
  c[0] = p.lng; c[1] = p.lat;
  st.feature.properties.heading = p.heading;
  st.feature.properties.spd = p.speedKmh || 0;
  setLabel(st, p, alt);

  // след: от старта до текущей позиции
  const coords = [];
  coords.push([st.geo.pts[0][1], st.geo.pts[0][0]]);
  const arc = (cn, lim) => { for (let j = 0; j <= 10 && j / 10 <= lim + 1e-9; j++) { const q = cornerAt(cn, j / 10); coords.push([q.lng, q.lat]); } };
  for (let i = 1; i <= p.seg; i++) {
    const cn = st.geo.corners && st.geo.corners[i];
    if (cn) arc(cn, p.cornerI === i ? p.cornerS : 1); else coords.push([st.geo.pts[i][1], st.geo.pts[i][0]]);
  }
  if (p.cornerI === p.seg + 1) arc(st.geo.corners[p.seg + 1], p.cornerS);
  coords.push([p.lng, p.lat]);
  st.trail.geometry.coordinates = coords;

  st.pos = p; st.alt = alt;
  dirtyT = true; dirtySel = true;
  st.nextUpd = now + 3000;   // следующее обновление маркера и следа — раз в 3 с
  if (p.done && !st.removeTimer && st.geo.segs.length >= 0 && t >= st.geo.totalTimeS) {
    st.removeTimer = setTimeout(() => removeTarget(st.key), 10000);   // долетела — держим 10 с и убираем
  }
}

/* ---------- правка маршрута с панели (targetEdits) ---------- */
function applyEdit(st, ed) {
  if (!ed || !Array.isArray(ed.route) || !ed.route.length) return;
  if ((Number(ed.ts) || 0) <= (st.editTs || 0)) return;
  const now = srvNow();
  const cur = st.alt || currentAlt(st, now);
  const route = ed.route.map(p => [Number(p[0]), Number(p[1]), Number(p[2]) || 0, Number(p[3]) || 0]);
  st.geo = buildGeo([Number(ed.lat), Number(ed.lng)], route, Number(ed.speed) || 0, cur);
  st.launchAtMs = Number(ed.t0) || now;
  st.editTs = Number(ed.ts) || 0;
  st.segOff = 0;
  if (st.removeTimer) { clearTimeout(st.removeTimer); st.removeTimer = null; }
  refreshState(st, now, true);
}

/* ---------- live-позиция с панели (раз в 5 с): подтягиваем при расхождении ---------- */
function applyLive(st, lv) {
  if (!lv || st.kab) return;
  const ts = Number(lv.ts) || 0, lat = Number(lv.lat), lng = Number(lv.lng), seg = Number(lv.seg) || 0;
  if (!isFinite(lat) || !isFinite(lng) || ts < st.launchAtMs) return;
  const exp = positionAt(st.geo, (ts - st.launchAtMs) / 1000);
  if (distM({ lat: exp.lat, lng: exp.lng }, { lat, lng }) < 150) return;   // расхождение мелкое — не трогаем
  const segs = st.geo.segs;
  // seg с панели — номер отрезка в ИСХОДНОМ маршруте, а после каждой подтяжки наш geo укорачивается
  // (начинается с текущего отрезка) — переводим в локальный индекс через segOff
  const local = seg - (st.segOff || 0);
  if (!segs.length || local < 0 || local >= segs.length) return;
  const rest = [];
  for (let i = local; i < segs.length; i++) rest.push([segs[i].b.lat, segs[i].b.lng, segs[i].speedKmh, segs[i].altM]);
  st.geo = buildGeo([lat, lng], rest, segs[local].speedKmh, segs[local].altM);
  st.segOff = seg;
  st.launchAtMs = ts;
  if (st.removeTimer) { clearTimeout(st.removeTimer); st.removeTimer = null; }   // панель говорит, что цель ещё летит
  refreshState(st, srvNow(), true);
}

/* =====================================================================
   ТИКЕР: один проход по целям + один setData на источник
   ===================================================================== */
const tickMs = () => states.size > 400 ? 500 : states.size > 150 ? 250 : 100;
function flushTargets() {
  dirtyT = false;
  const feats = [], trails = [];
  for (const st of states.values()) { if (hiddenCats[targetCat(st)]) continue; feats.push(st.feature); trails.push(st.trail); }
  setData('targets', feats);
  setData('trails', trails);
}
// Удаление долетевших целей по ВРЕМЕНИ, а не по таймеру из refreshState: пока вкладка скрыта,
// refreshState не вызывается и таймер удаления просто не ставился — маркер висел вечно.
const DONE_KEEP_MS = 10000;
function expireDone(now) {
  for (const st of [...states.values()]) {
    if (!st.geo) continue;

}

function tick() {
  // любая ошибка внутри тика раньше убивала весь цикл (setTimeout в конце не вызывался) —
  // карта замирала, цели не двигались и не удалялись. Теперь одна кривая цель не ломает остальные.
  try {
    if (mapReady) expireDone(srvNow());   // работает и в фоновой вкладке
    if (mapReady && !document.hidden) {
      const now = srvNow();
      for (const st of states.values()) {
        if (!(now < st.nextUpd)) {
          try { refreshState(st, now); }
          catch (err) { console.error('[tick] цель', st.key, err); st.nextUpd = now + 3000; }
        }

      if (dirtyT) flushTargets();
      updateSelection(now);
      flushImages(pendingImgRemove);

}

/* =====================================================================
   FIREBASE → КАРТА (та же логика, что в старом index.html)
   ===================================================================== */
let attached = false;
function attachFirebase() {
  if (attached) return; attached = true;
  const startTime = srvNow();   // слушаем только цели, добавленные ПОСЛЕ открытия страницы

  // 🎯 новые цели
  db.ref('targets').on('child_added', snap => {
    const t = snap.val();
    if (!t || !t.createdAt || t.createdAt < startTime) return;

    const spawnLat = Number(t.spawn && t.spawn[0]), spawnLng = Number(t.spawn && t.spawn[1]);
    if (!isFinite(spawnLat) || !isFinite(spawnLng)) return;
    const speed = Number(t.speed) || 0;
    const delaySec = Number(t.spawnDelay ?? t.delay) || 0;                       // оба названия поля задержки
    const baseAt = Number(t.launchedAt) || Number(t.createdAt) || srvNow();
    const launchAtMs = baseAt + delaySec * 1000;                                  // момент запуска по серверному времени
    const route = Array.isArray(t.route)
      ? t.route.map(pt => [Number(pt[0]), Number(pt[1]), Number(pt[2]) || 0, Number(pt[3]) || 0]) : [];

    setTimeout(() => spawnTarget({ key: snap.key, spawn: [spawnLat, spawnLng], route, speed, type: t.type, launchAtMs }),
               Math.max(0, launchAtMs - srvNow()));

    // ⚡ триггеры (сброс КАБ и т.п.): launchAt + время до вайпоинта + задержка
    if (Array.isArray(t.triggers)) {
      t.triggers.forEach((trig, idx) => {
        const trigSpawn = trig.spawn;
        if (!Array.isArray(trigSpawn) || trigSpawn.length < 2) return;
        const wp = Number(trig.wpIndex) || 0;
        const trigSpeed = Number(trig.speed) || 450;
        const trigDelay = Number(trig.delay) || 12;
        const trigRoute = Array.isArray(trig.route) ? trig.route.map(pt => [Number(pt[0]), Number(pt[1])]) : [];
        const trigAt = launchAtMs + timeToWpMs([spawnLat, spawnLng], route, speed, wp) + trigDelay * 1000;
        setTimeout(() => {
          const parent = states.get(snap.key);
          const startH = parent && parent.alt > 0 ? parent.alt : 0;
          spawnTarget({ key: snap.key + '_trig' + idx, spawn: [Number(trigSpawn[0]), Number(trigSpawn[1])],
                        route: trigRoute, speed: trigSpeed, type: 'КАБ', launchAtMs: trigAt, kabStart: startH });
        }, Math.max(0, trigAt - srvNow()));
      });
    }
  });

  // 📡 live-позиции с панели (раз в 5 с)
  const onLive = s => {
    const lv = s.val(); if (!lv) return;
    liveCache[s.key] = lv;
    const st = states.get(s.key); if (st) applyLive(st, lv);
  };
  db.ref('live').on('child_added', onLive);
  db.ref('live').on('child_changed', onLive);
  db.ref('live').on('child_removed', s => { delete liveCache[s.key]; });

  // ✏️ правки сикеров с панели в реальном времени
  const onEdit = s => {
    const ed = s.val(); if (!ed) return;
    editCache[s.key] = ed;
    const st = states.get(s.key); if (st) applyEdit(st, ed);
  };
  db.ref('targetEdits').on('child_added', onEdit);
  db.ref('targetEdits').on('child_changed', onEdit);
  db.ref('targetEdits').on('child_removed', s => { delete editCache[s.key]; });

  // 🗑 удаление цели с другого клиента
  db.ref('targetDeletes').on('child_added', s => removeTarget(s.key));
}

        if (!(t < a.nextUpd)) {                         // как у красных целей: показ своей авиации обновляется раз в 3 с

          a.d = { lng: a.p.lng, lat: a.p.lat, h: a.h, alt: a.alt, v: a.v };
          a.f.geometry.coordinates = [a.d.lng, a.d.lat]; a.f.properties.heading = a.d.h; a.f.properties.spd = a.d.v * 3.6;
          a.trail.push([a.d.lng, a.d.lat]); if (a.trail.length > 400) a.trail.shift(); airDirty = true;
        }
        const D = a.d; if (!D) return;
        const k = Math.round(D.alt / 10) + '|' + Math.round(D.v * 3.6 / 10);
        if (k !== a.lblKey) {
          a.lblKey = k;
          const img = makeLabelImage([`${a.num} ${a.type}`, `${Math.round(D.v * 3.6 / 10) * 10}км/г ${Math.round(D.alt / 10) * 10}м`], PAL);
          const name = 'flbl-' + (++fImg); map.addImage(name, img.data, { pixelRatio: img.dpr });
          if (a.lbl) oldImgs.push(a.lbl); a.lbl = name; a.f.properties.lbl = name; airDirty = true;
        }
      });
      if (airDirty) {
        airDirty = false;
        const fs = map.getSource('fr-src'), ts = map.getSource('fr-trail');
        if (fs) fs.setData({ type: 'FeatureCollection', features: air.map(a => a.f) });
        if (ts) ts.setData({ type: 'FeatureCollection', features: air.map(a => a.tf) });
      }
      flushImages(oldImgs);
      updCard();
    }, 200);
  }
  if (map.loaded()) setup(); else map.on('load', () => { try { document.fonts.load('800 12px Manrope').then(setup, setup); } catch (e) { setup(); } });

  map.on('click', e => {                                   // после общего обработчика красных целей
    const fr = map.queryRenderedFeatures(e.point, { layers: ['fr-arrows', 'fr-labels'] });
    if (fr.length) { select(null); selectAir(air.find(a => a.num === fr[0].properties.i)); return; }
    if (targeting && sel) {
      const red = map.queryRenderedFeatures(e.point, { layers: ['arrows', 'labels'] });
      if (red.length && states.has(red[0].properties.key)) {
        command(sel, 'approach', red[0].properties.key); startFlights(sel);
        select(null); targeting = false; document.getElementById('fbTgt').classList.remove('on'); updCard(); return;
      }
    }
    targeting = false; sel = null; fcard.style.display = 'none'; menu.style.display = 'none';
  });
})();

/* ---------- ВЕРТОЛЁТЫ (синие): кнопка → Ми-8 / Ми-24 → клик по карте → «Обрати ціль» (до 250 км/г) → сопровождение 10–20 мин → сбитие ---------- */
(function () {
  const TYPES = { 'Ми-8': { mx: 260 }, 'Ми-24': { mx: 330 } };   // макс. скорость, км/г (должна быть выше 250, чтобы догнать цель)

  const RD = Math.PI / 180, MPD = 111320;
  const norm = a => ((a % 360) + 360) % 360, dh = (a, b) => ((b - a + 540) % 360) - 180, clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
  const offs = (p, h, m) => ({ lat: p.lat + Math.cos(h * RD) * m / MPD, lng: p.lng + Math.sin(h * RD) * m / (MPD * Math.cos(p.lat * RD)) });
  const STATUS = { idle: 'на землі', follow: 'супроводжує ціль', patrol: 'чекає ціль (кружляє)', hover: 'зависання', land: 'заходить на посадку' };

  const heli = []; const oldImgs = [];
  let sel = null, targeting = false, placing = null, hnum = 2000, hImg = 0, hDirty = true, flashMsg = '', flashTimer = null;

  /* ---------- иконка вертолёта (вид сверху, нос вверх): чёрная обводка + цвет ---------- */
  function makeHeliImage(col = '#6fb4ff') {
    const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round';
    const body = () => { g.beginPath(); g.ellipse(32, 29, 6, 10.5, 0, 0, Math.PI * 2); };
    const tail = () => { g.beginPath(); g.moveTo(32, 38); g.lineTo(32, 56); g.moveTo(27.5, 56); g.lineTo(36.5, 56); };
    const rotor = () => { g.beginPath(); g.moveTo(15, 12); g.lineTo(49, 46); g.moveTo(49, 12); g.lineTo(15, 46); };
    g.strokeStyle = '#000';

    el.textContent = flashMsg ? flashMsg
      : targeting ? `Натисни на ціль на карті (до ${MAX_TGT} км/г)`
      : (sel.d ? `${Math.round(sel.d.v * 3.6)} км/г · ${Math.round(sel.d.alt)} м` : '');
  }

  /* ---------- создание и команды ---------- */
  function spawn(ll) {
    const p = { lat: ll.lat, lng: ll.lng };
    const h = { num: ++inum, p, h: 0, v: 0, alt: 0, mode: 'idle', key: null, vc: (240 + Math.random() * 30) / 3.6, cool: 0,   // крейсерская 270–300 км/г
      lbl: '', lblKey: '', nextUpd: 0, seenPos: null, d: null, trail: [[p.lng, p.lat], [p.lng, p.lat]],
      f: { type: 'Feature', properties: { heading: 0, lbl: '', i: inum }, geometry: { type: 'Point', coordinates: [p.lng, p.lat] } }, tf: null };
    h.tf = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: h.trail } };
    ics.push(h); iDirty = true;
  }
  function liveSpeed(tg) {
    const p = positionAt(tg.geo, (srvNow() - tg.launchAtMs) / 1000);
    return p.done ? 0 : (p.speedKmh || 0);
  }
  function command(h, key) {
    const tg = states.get(key); if (!tg) return;
    h.mode = 'align'; h.key = key;
    h.chase = 0; h.need = 120 + Math.random() * 120;                  // гоняется минимум 2–4 мин, прежде чем пойти на касание
    if (h.v < 1) { const p = positionAt(tg.geo, (srvNow() - tg.launchAtMs) / 1000); h.h = bearingDeg(h.p, { lat: p.lat, lng: p.lng }); }
  }
  const loc = (o, p) => [(p.lng - o.lng) * MPD * Math.cos(o.lat * RD), (p.lat - o.lat) * MPD];   // вектор o→p, м (восток, север)

  /* ---------- движение ---------- */
  function step(h, dt, tms) {
    if (h.mode === 'idle') return;
    let wantV = 0, wantAlt = h.alt, wantH = h.h;
    if (h.mode === 'align' || h.mode === 'strike') {
      const tg = states.get(h.key);
      if (!tg || !tg.geo) { h.mode = 'hover'; h.key = null; }              // цель пропала — ждём
      else {
        const t0 = (tms - tg.launchAtMs) / 1000;
        const tp = positionAt(tg.geo, t0);
        const tv = tp.done ? 0 : (tp.speedKmh || 0) / 3.6, th = tp.heading || 0;
        const tAlt = tg.kab ? kabAlt(tg, tp) : (tp.altM || 0);
        const vi = clamp(Math.max(h.vc, tv + 8 / 3.6), 0, VMAX);          // 270–300, быстрее цели (на сколько позволяет предел 300)
        const tpos = { lat: tp.lat, lng: tp.lng };
        const [rx, ry] = loc(tpos, h.p);                                   // где перехватчик относительно цели
        const along = rx * Math.sin(th * RD) + ry * Math.cos(th * RD);     // <0 — позади цели
        const cross = rx * Math.cos(th * RD) - ry * Math.sin(th * RD);
        const dist = Math.hypot(rx, ry);
        // упреждение: где цель будет через время подлёта (по её маршруту)
        let T = dist / vi, fp = tpos, fh = th;
        for (let k = 0; k < 3; k++) { const q = positionAt(tg.geo, t0 + Math.min(T, 1200)); fp = { lat: q.lat, lng: q.lng }; fh = q.heading || th; const [ex, ey] = loc(h.p, fp); T = Math.hypot(ex, ey) / vi; }
        if (h.mode === 'align') {
          if (along < -120 && Math.abs(cross) < 260) h.mode = 'strike';    // встал в хвост — идём в упор
          else if (dist < 80) h.mode = 'strike';
        } else if (along > 60 && dist > 300) h.mode = 'align';             // проскочил вперёд — заходим заново
        const aim = h.mode === 'align' ? offs(fp, fh + 180, TRAIL_BEHIND) : fp;   // точка за хвостом / сама цель
        const [ax, ay] = loc(h.p, aim);
        wantH = norm(Math.atan2(ax, ay) / RD); wantV = vi;
        wantAlt = Math.max(30, tAlt);
        // касание: вплотную по месту и по высоте (проверяем путь за шаг, чтобы не проскочить)
        const [cx, cy] = loc(h.p, tpos), mvx = Math.sin(h.h * RD) * h.v * dt, mvy = Math.cos(h.h * RD) * h.v * dt;
        const tt = clamp((cx * mvx + cy * mvy) / (mvx * mvx + mvy * mvy || 1), 0, 1);
        const miss = Math.hypot(cx - mvx * tt, cy - mvy * tt);
        h.chase = (h.chase || 0) + dt;
        if (h.cool > 0) h.cool -= dt;
        else if (h.chase >= (h.need || 0) && miss < HIT_R && Math.abs(h.alt - tAlt) < 60) {
          if (Math.random() < HIT_P) {
            const k = h.key; removeU(h); deleteTarget(k);                 // таран: перехватчик исчезает, цель сбита
            return;
          }
          h.cool = MISS_COOL; h.mode = 'align'; h.need = h.chase + 60 + Math.random() * 120;   // после промаха ещё 1–3 мин погони                          // промах: проскакивает мимо и заходит заново
        }
      }
    }
    h.v += clamp(wantV - h.v, -12 * dt, 12 * dt);
    h.h = norm(h.h + clamp(dh(h.h, wantH), -50 * dt, 50 * dt));
    h.alt += clamp(wantAlt - h.alt, -35 * dt, 35 * dt);
    if (h.v > 0) h.p = offs(h.p, h.h, h.v * dt);
  }

  /* ---------- карта ---------- */
  function setup() {
    map.addImage('uav-black', makeIcImage(), { pixelRatio: 2 });
    map.addSource('ic-trail', { type: 'geojson', data: EMPTY() });
    map.addSource('ic-src', { type: 'geojson', data: EMPTY() });
    map.addLayer({ id: 'ic-trail', type: 'line', source: 'ic-trail', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#000', 'line-width': 1.3 } });
    map.addLayer({ id: 'ic-labels', type: 'symbol', source: 'ic-src', layout: { 'icon-image': ['get', 'lbl'], 'icon-anchor': 'left', 'icon-offset': [10, 0],
      'icon-rotation-alignment': 'viewport', 'icon-pitch-alignment': 'viewport', 'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    map.addLayer({ id: 'ic-arrows', type: 'symbol', source: 'ic-src', layout: { 'icon-image': 'uav-black', 'icon-size': 0.85,
      'icon-rotate': ['get', 'heading'], 'icon-rotation-alignment': 'map', 'icon-pitch-alignment': 'map',
      'icon-allow-overlap': true, 'icon-ignore-placement': true } });
    map.moveLayer('ic-labels', 'fast-ring');
    map.moveLayer('ic-trail', 'trail-line');

    let last = performance.now();
    setInterval(() => {
      const now = performance.now(), dt = Math.min(1800, (now - last) / 1000); last = now;
      const n = Math.max(1, Math.ceil(dt / 0.5)), t1 = srvNow();
      ics.slice().forEach(h => { for (let i = 1; i <= n && ics.includes(h); i++) step(h, dt / n, t1 - dt * 1000 + dt * 1000 * i / n); });
      if (document.hidden) { flushImages(oldImgs); return; }
      ics.forEach(h => {
        const t = Date.now();
        const tg = (h.mode === 'align' || h.mode === 'strike') ? states.get(h.key) : null;
        const due = tg ? (tg.pos !== h.seenPos || t > h.nextUpd + 4000) : !(t < h.nextUpd);
        if (due) {
          h.nextUpd = t + 3000; h.seenPos = tg ? tg.pos : null;
          h.d = { lng: h.p.lng, lat: h.p.lat, h: h.h, alt: h.alt, v: h.v };
          h.f.geometry.coordinates = [h.d.lng, h.d.lat]; h.f.properties.heading = h.d.h;
          h.trail.push([h.d.lng, h.d.lat]); if (h.trail.length > 400) h.trail.shift(); iDirty = true;
        }
        const D = h.d; if (!D) return;
        const k = Math.round(D.alt / 10) + '|' + Math.round(D.v * 3.6 / 10);
        if (k !== h.lblKey) {
          h.lblKey = k;
          const img = makeLabelImage([`${h.num} БпЛА Перехоп.`, `${Math.round(D.v * 3.6 / 10) * 10}км/г ${Math.round(D.alt / 10) * 10}м`], PAL);
          const name = 'iclbl-' + (++iImg); map.addImage(name, img.data, { pixelRatio: img.dpr });
          if (h.lbl) oldImgs.push(h.lbl); h.lbl = name; h.f.properties.lbl = name; iDirty = true;
        }
      });
      if (iDirty) {
        iDirty = false;
        const fs = map.getSource('ic-src'), ts = map.getSource('ic-trail');
        if (fs) fs.setData({ type: 'FeatureCollection', features: ics.map(h => h.f) });
        if (ts) ts.setData({ type: 'FeatureCollection', features: ics.map(h => h.tf) });
      }
      flushImages(oldImgs);
      updCard();
    }, 200);
  }
  if (map.loaded()) setup(); else map.on('load', () => { try { document.fonts.load('800 12px Manrope').then(setup, setup); } catch (e) { setup(); } });

  map.on('click', e => {
    const rb = document.getElementById('rbtn'); if (rb && rb.classList.contains('on')) return;   // идёт замер линейкой
    if (placing) { spawn(e.lngLat); stopPlacing(); menu.style.display = 'none'; select(null); return; }
    const layers = ['ic-arrows', 'ic-labels'].filter(id => map.getLayer(id));
    const hit = layers.length ? map.queryRenderedFeatures(e.point, { layers }) : [];
    if (hit.length) { select(null); selectU(ics.find(h => h.num === hit[0].properties.i) || null); return; }
    if (targeting && sel) {
      const red = map.queryRenderedFeatures(e.point, { layers: ['arrows', 'labels'] });
      if (red.length && states.has(red[0].properties.key)) {
        const key = red[0].properties.key, spd = liveSpeed(states.get(key));
        select(null);
        if (spd > MAX_TGT) { flash(`Ціль летить ${Math.round(spd)} км/г — потрібна не швидше ${MAX_TGT}`); return; }
        command(sel, key); targeting = false; document.getElementById('ubTgt').classList.remove('on'); updCard(); return;
      }
    }
    targeting = false; sel = null; ucard.style.display = 'none'; menu.style.display = 'none';
  });
})();
</script>
</body>
</html>
